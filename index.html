  header{text-align:center;padding:2rem 1rem 1rem;border-bottom:2px solid rgba(240,192,64,0.3);background:linear-gradient(180deg,rgba(204,34,34,0.15) 0%,transparent 100%)}
  header h1{font-family:'Cinzel',serif;font-size:clamp(1.8rem,5vw,3rem);font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(240,192,64,0.5),2px 2px 0 #000;letter-spacing:4px}
  header p{color:#94a3b8;margin-top:0.4rem;font-size:0.95rem}
  .guess-counter{display:inline-block;margin-top:0.5rem;background:rgba(240,192,64,0.15);border:1px solid var(--dark-gold);border-radius:20px;padding:3px 14px;font-size:0.85rem;color:var(--gold)}
  #app{max-width:1300px;margin:0 auto;padding:1.5rem 1rem}
  .search-section{display:flex;gap:10px;margin-bottom:1.5rem;position:relative}
  .search-wrapper{position:relative;flex:1}
  #search-input{width:100%;background:var(--card);border:2px solid rgba(240,192,64,0.4);color:var(--white);padding:12px 16px;border-radius:10px;font-size:1rem;font-family:'Nunito',sans-serif;transition:border-color 0.2s;outline:none}
  #search-input:focus{border-color:var(--gold)}
  #search-input::placeholder{color:#4b5563}
  #search-input:disabled{opacity:0.5;cursor:not-allowed}
  #suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid rgba(240,192,64,0.3);border-radius:10px;max-height:260px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  #suggestions.show{display:block}
  .suggestion-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:10px;font-size:0.95rem;transition:background 0.15s}
  .suggestion-item:last-child{border-bottom:none}
  .suggestion-item:hover,.suggestion-item.active{background:rgba(240,192,64,0.12)}
  .suggestion-item.already-guessed{opacity:0.4;pointer-events:none}
  .suggestion-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.78rem;flex-shrink:0;color:white;border:2px solid rgba(255,255,255,0.2)}
  .grid-section{overflow-x:auto}
  .grid-headers{display:grid;grid-template-columns:155px 70px 160px 140px 110px 115px 125px 115px 80px;gap:5px;margin-bottom:5px;padding:0 2px}
  .grid-header{background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.3);border-radius:6px;padding:8px 4px;text-align:center;font-size:0.68rem;font-weight:700;font-family:'Cinzel',serif;color:var(--gold);letter-spacing:0.5px;text-transform:uppercase}
  #guess-grid{display:flex;flex-direction:column;gap:5px}
  .guess-row{display:grid;grid-template-columns:155px 70px 160px 140px 110px 115px 125px 115px 80px;gap:5px;animation:slideIn 0.4s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  .guess-cell{border-radius:8px;padding:8px 5px;text-align:center;font-size:0.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border:2px solid transparent;word-break:break-word;line-height:1.3}
  .cell-green{background:linear-gradient(135deg,#166534,#15803d);border-color:#22c55e;color:#dcfce7}
  .cell-yellow{background:linear-gradient(135deg,#713f12,#92400e);border-color:#eab308;color:#fef9c3}
  .cell-red{background:linear-gradient(135deg,#450a0a,#7f1d1d);border-color:#ef4444;color:#fee2e2}
  .cell-name{background:linear-gradient(135deg,#1e3a5f,#1e40af);border-color:#3b82f6;color:#dbeafe;flex-direction:row!important;gap:8px;justify-content:flex-start!important;padding:8px!important}
  .cell-label{font-size:0.62rem;opacity:0.7;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px}
  .cell-value{font-size:0.8rem}
  .cell-arrow{font-size:1.1rem;display:block;margin-top:2px}
  .char-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;flex-shrink:0;color:white;border:2px solid rgba(255,255,255,0.25)}
  #result-screen{display:none;text-align:center;padding:2rem;margin-top:1.5rem;border-radius:16px;animation:slideIn 0.5s ease}
  #result-screen.win{display:block;background:linear-gradient(135deg,rgba(22,101,52,0.3),rgba(21,128,61,0.2));border:2px solid var(--green)}
  #result-screen.lose{display:block;background:linear-gradient(135deg,rgba(127,29,29,0.3),rgba(153,17,17,0.2));border:2px solid var(--red)}
  #result-screen h2{font-family:'Cinzel',serif;font-size:1.8rem;margin-bottom:0.5rem;color:var(--gold)}
  #result-screen p{color:#94a3b8;margin-bottom:1rem;font-size:1.05rem}
  .character-card{display:inline-flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:14px 20px;margin:0.8rem auto;text-align:left}
  .character-card-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;border:2px solid var(--gold);flex-shrink:0;color:white}
  .character-card-info h3{font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem}
  .character-card-info p{color:#94a3b8;font-size:0.82rem;margin-top:2px}
  .btn-new-game{background:linear-gradient(135deg,var(--dark-gold),var(--gold));color:#000;border:none;padding:12px 30px;border-radius:10px;font-size:1rem;font-weight:700;font-family:'Cinzel',serif;cursor:pointer;letter-spacing:1px;margin-top:0.5rem;transition:transform 0.1s}
  .btn-new-game:hover{transform:scale(1.03)}
  .btn-giveup{background:transparent;color:#6b7280;border:1px solid #374151;padding:8px 18px;border-radius:8px;font-size:0.85rem;cursor:pointer;margin-left:8px;transition:color 0.2s,border-color 0.2s}
  .btn-giveup:hover{color:var(--red);border-color:var(--red)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:1.2rem;font-size:0.77rem;color:#94a3b8}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
  .empty-state{text-align:center;color:#374151;padding:3rem 1rem;font-size:0.95rem}
  .empty-state .skull{font-size:3rem;display:block;margin-bottom:0.5rem}
  
  .mode-switcher{display:flex;justify-content:center;gap:12px;margin:1rem 0 0.5rem}
  .mode-btn{background:rgba(240,192,64,0.1);border:2px solid rgba(240,192,64,0.3);color:#94a3b8;padding:10px 24px;border-radius:30px;font-size:0.9rem;font-weight:700;font-family:'Cinzel',serif;cursor:pointer;transition:all 0.2s;letter-spacing:1px}
  .mode-btn.active{background:linear-gradient(135deg,var(--dark-gold),var(--gold));border-color:var(--gold);color:#000}
  .mode-btn:hover:not(.active){border-color:var(--gold);color:var(--gold)}
  #desc-mode{display:none}
  #desc-mode.active{display:block}
  #classic-mode.hidden{display:none}
  .clue-container{max-width:700px;margin:0 auto 1.5rem;display:flex;flex-direction:column;gap:10px}

  .clue-text{font-size:0.95rem;color:var(--white);line-height:1.4}

  .stat-icon{font-size:1.4rem;flex-shrink:0}
  .stat-label{font-weight:700;color:var(--gold);font-size:0.85rem;font-family:'Cinzel',serif;letter-spacing:0.5px}

  .sil-clue{background:var(--card);border:2px solid rgba(240,192,64,0.25);border-radius:10px;padding:12px 18px;display:flex;gap:12px;align-items:center}

  .ab-text.blurred{filter:blur(5px);user-select:none}

// ── CHARACTER IMAGES ────────────────────────────────────────────────────────
// Fetches all One Piece characters from MAL in one call on load, builds a
// name→imageURL map, then updates any waiting DOM elements.
const charImages = {};       // normalised-name → url  (populated async)
const imageWaiters = {};     // normalised-name → [elId, ...]

function normName(n){ return n.toLowerCase().replace(/[^a-z0-9]/g,''); }

async function loadAllCharImages(){
  try {
    // MAL anime ID 21 = One Piece; returns all characters with images
    const pages = [1,2,3,4];
    for(const page of pages){
      const r = await fetch('https://api.jikan.moe/v4/anime/21/characters?page='+page);
      if(!r.ok) break;
      const d = await r.json();
      const list = d.data || [];
      if(!list.length) break;
      list.forEach(entry => {
        const ch = entry.character;
        if(!ch) return;
        const url = ch.images?.jpg?.image_url;
        if(!url) return;
        // Store by normalised name
        const key = normName(ch.name);
        charImages[key] = url;
        // Also try reversed name (MAL uses "Last, First")
        const parts = ch.name.split(', ');
        if(parts.length===2){
          const fwd = normName(parts[1]+' '+parts[0]);
          charImages[fwd] = url;
        }
        // Flush any DOM elements waiting for this key
        (imageWaiters[key]||[]).forEach(elId => applyImg(elId, url));
        delete imageWaiters[key];
      });
      if(list.length < 25) break; // last page
      await new Promise(r2=>setTimeout(r2,500)); // rate-limit pause
    }
  } catch(e){ console.warn('Image load failed:', e); }
}

function requestImage(charName, elId){
  const key = normName(charName);
  if(charImages[key]){
    // Already loaded – apply immediately (next tick so DOM is ready)
    setTimeout(()=>applyImg(elId, charImages[key]), 0);
    return;
  }
  if(!imageWaiters[key]) imageWaiters[key]=[];
  imageWaiters[key].push(elId);
}

function applyImg(elId, url){
  const el = document.getElementById(elId);
  if(!el || !url) return;
  const init = el.dataset.init || '';
  const bg   = el.dataset.bg   || '';
  const img = new Image();
  img.onload = ()=>{
    if(!document.getElementById(elId)) return; // element gone
    el.style.background = 'none';
    el.style.padding = '0';
    el.style.overflow = 'hidden';
    el.textContent = '';
    el.appendChild(img);
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
  };
  img.onerror = ()=>{}; // keep initials on error
  img.src = url;
}

function avatarColor(c){ return ATYPE_COLOR[c.affiliationType]||'#374151'; }

// Build reverse lookup: alias (lowercase) -> canonical name
const ALIAS_LOOKUP = {};
Object.entries(ALIASES).forEach(([canon, aliases]) => {
  aliases.forEach(a => {
    ALIAS_LOOKUP[a.toLowerCase()] = canon;
  });
});

function searchByAlias(q) {
  // Returns list of canonical names that match by alias
  return Object.keys(ALIAS_LOOKUP)
    .filter(a => a.includes(q))
    .map(a => ALIAS_LOOKUP[a]);
}

let target=null, guesses=[], gameOver=false, activeIdx=-1, currSuggestions=[];

function pickRandom(){ return CHAR_DB[Math.floor(Math.random()*CHAR_DB.length)]; }

function initGame(){
  target=pickRandom(); guesses=[]; gameOver=false; activeIdx=-1;
  document.getElementById('guess-grid').innerHTML='<div class="empty-state"><span class="skull">☠️</span>Make your first guess to see the hints!</div>';
  const rs=document.getElementById('result-screen');
  rs.className=''; rs.innerHTML=''; rs.style.cssText='display:none';
  const inp=document.getElementById('search-input');
  inp.value=''; inp.disabled=false; inp.placeholder='Type a character name to guess...';

// ── AUTOCOMPLETE ──────────────────────────────────────
const searchInput=document.getElementById('search-input');
const suggestionsEl=document.getElementById('suggestions');

searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){hideSuggestions();return;}

  // Match by name OR alias
  const byName=CHAR_DB.filter(c=>c.name.toLowerCase().includes(q));
  const aliasNames=new Set(searchByAlias(q));
  const byAlias=CHAR_DB.filter(c=>aliasNames.has(c.name)&&!byName.includes(c));
  const combined=[...byName,...byAlias].slice(0,10);

  currSuggestions=combined;
  if(!currSuggestions.length){hideSuggestions();return;}

  suggestionsEl.innerHTML=currSuggestions.map((c,i)=>{
    const guessed=guesses.includes(c.name);
    const init=c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const col=avatarColor(c);
    const sugId='sg-'+c.name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+i;
    requestImage(c.name, sugId);
    // Find which alias matched (if any)
    const matchedAlias=(ALIASES[c.name]||[]).find(a=>a.toLowerCase().includes(q));
    return `<div class="suggestion-item${guessed?' already-guessed':''}" data-index="${i}" onclick="selectSuggestion(${i})">
      <div class="suggestion-avatar" id="${sugId}" data-init="${init}" data-bg="linear-gradient(135deg,${col},${col}88)" style="background:linear-gradient(135deg,${col},${col}88)">${init}</div>
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
        <span>${c.name}</span>
        ${matchedAlias?'<small style="color:#94a3b8;font-size:0.78rem">aka '+matchedAlias+'</small>':''}
      </div>
      ${guessed?'<small style="color:#6b7280;margin-left:auto;flex-shrink:0">Already guessed</small>':''}
    </div>`;
  }).join('');
  activeIdx=-1;
  suggestionsEl.classList.add('show');
});

searchInput.addEventListener('keydown',e=>{
  const sugOpen=suggestionsEl.classList.contains('show');
  if(e.key==='ArrowDown'&&sugOpen){e.preventDefault();activeIdx=Math.min(activeIdx+1,currSuggestions.length-1);highlightSuggestion();}
  else if(e.key==='ArrowUp'&&sugOpen){e.preventDefault();activeIdx=Math.max(activeIdx-1,-1);highlightSuggestion();}
  else if(e.key==='Enter'){
    e.preventDefault();
    if(sugOpen){
      if(activeIdx>=0)selectSuggestion(activeIdx);
      else if(currSuggestions.length)selectSuggestion(0);
    } else {
      submitGuess();
    }
  }
  else if(e.key==='Escape')hideSuggestions();
});

function highlightSuggestion(){
  document.querySelectorAll('.suggestion-item').forEach((el,i)=>el.classList.toggle('active',i===activeIdx));
}
function selectSuggestion(i){
  const c=currSuggestions[i];
  if(!c)return;
  searchInput.value=c.name;
  hideSuggestions();
  submitGuess();
}
function hideSuggestions(){
  suggestionsEl.classList.remove('show');
  suggestionsEl.innerHTML='';
  currSuggestions=[];
}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrapper'))hideSuggestions();});

// ── COMPARE FUNCTIONS ─────────────────────────────────
function compareGender(g,t){return g.gender===t.gender?'green':'red';}

function compareAffiliation(g,t){
  if(g.affiliation===t.affiliation)return 'green';
  if(g.affiliationType===t.affiliationType)return 'yellow';
  return 'red';
}

function compareDevilFruit(g,t){
  const hG=g.devilFruitType!=='None'&&g.devilFruitType!=='Unknown';
  const hT=t.devilFruitType!=='None'&&t.devilFruitType!=='Unknown';
  if(g.devilFruitType===t.devilFruitType)return 'green';
  if(hG&&hT)return 'yellow';
  return 'red';
}

function compareBounty(g,t){
  if(g.bounty===t.bounty)return{color:'green',arrow:'='};
  const arrow=t.bounty>g.bounty?'↑':'↓';
  const mx=Math.max(g.bounty,t.bounty),mn=Math.min(g.bounty,t.bounty);
  const ratio=mx>0?mn/mx:1;
  return{color:ratio>0.7?'yellow':'red',arrow};
}

function compareSea(g,t){
  if(g.sea===t.sea)return 'green';
  const gl=['Grand Line','New World'];
  if(gl.includes(g.sea)&&gl.includes(t.sea))return 'yellow';
  return 'red';
}

const ARC_ORDER=["Romance Dawn","Orange Town","Syrup Village","Baratie","Arlong Park","Loguetown","Reverse Mountain","Whisky Peak","Little Garden","Drum Island","Alabasta","Jaya","Skypiea","Long Ring Long Land","Water 7","Enies Lobby","Thriller Bark","Sabaody","Amazon Lily","Impel Down","Marineford","Post-War","Fish-Man Island","Punk Hazard","Dressrosa","Zou","Whole Cake Island","Levely","Wano","Egghead","Unknown"];
function arcIdx(a){const i=ARC_ORDER.indexOf(a||'Unknown');return i===-1?ARC_ORDER.length-1:i;}
function compareArc(g,t){
  const gA=g.arc||'Unknown', tA=t.arc||'Unknown';
  if(gA===tA)return {color:'green',arrow:'='};
  const gI=arcIdx(gA), tI=arcIdx(tA);
  const arrow=tI>gI?'↑':'↓';
  if((ARC_TO_SAGA[gA]||gA)===(ARC_TO_SAGA[tA]||tA))return {color:'yellow',arrow};
  return {color:'red',arrow};
}

function hakiSet(h){
  if(!h||h==='None')return new Set();
  return new Set(h.split(', '));
}
function compareHaki(g,t){
  const gH=g.haki||'None', tH=t.haki||'None';
  if(gH===tH)return 'green';
  const gS=hakiSet(gH), tS=hakiSet(tH);
  if(gS.size===0||tS.size===0)return 'red';
  for(const k of gS)if(tS.has(k))return 'yellow';
  return 'red';
}

function compareStatus(g,t){return g.status===t.status?'green':'red';}

// ── FORMAT ────────────────────────────────────────────
function fmtBounty(n){
  if(!n)return 'None';
  if(n>=1e9)return(n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return Math.round(n/1e6)+'M';
  if(n>=1e3)return Math.round(n/1e3)+'K';
  return n+'';
}

// ── CELL BUILDERS ─────────────────────────────────────
function cell(cls,value,label){
  return `<div class="guess-cell cell-${cls}">
    ${label?`<span class="cell-label">${label}</span>`:''}
    <span class="cell-value">${value}</span>
  </div>`;
}

function bountyCell(r,bounty){
  return `<div class="guess-cell cell-${r.color}">
    <span class="cell-label">Bounty</span>
    <span class="cell-value">${fmtBounty(bounty)}</span>
    <span class="cell-arrow">${r.arrow}</span>
  </div>`;
}
function arcCell(r,arcName){
  return `<div class="guess-cell cell-${r.color}">
    <span class="cell-label">First Arc</span>
    <span class="cell-value">${arcName}</span>
    ${r.arrow!=='='?`<span class="cell-arrow">${r.arrow}</span>`:''}
  </div>`;
}

function nameCell(c){
  const init=c.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const col=avatarColor(c);
  const elId='av-'+c.name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now();
  requestImage(c.name, elId);
  return `<div class="guess-cell cell-name">
    <div class="char-avatar" id="${elId}" data-init="${init}" data-bg="linear-gradient(135deg,${col},${col}99)" style="background:linear-gradient(135deg,${col},${col}99)">${init}</div>
    <span style="font-size:0.73rem;font-weight:700;text-align:left;line-height:1.2">${c.name}</span>
  </div>`;
}

// ── SUBMIT GUESS ──────────────────────────────────────
function submitGuess(){
  if(gameOver)return;
  const raw=searchInput.value.trim();
  if(!raw){flash();return;}
  const gc=CHAR_DB.find(c=>c.name.toLowerCase()===raw.toLowerCase());
  if(!gc){showErr('Character not found — pick from the list!');return;}
  if(guesses.includes(gc.name)){showErr('Already guessed!');return;}

  guesses.push(gc.name);
  searchInput.value='';
  hideSuggestions();

  const grid=document.getElementById('guess-grid');
  const empty=grid.querySelector('.empty-state');
  if(empty)empty.remove();

  const br=compareBounty(gc,target);
  const row=document.createElement('div');
  row.className='guess-row';
  row.innerHTML=`
    ${nameCell(gc)}
    ${cell(compareGender(gc,target),gc.gender,'Gender')}
    ${cell(compareAffiliation(gc,target),gc.affiliation,'Crew')}
    ${cell(compareDevilFruit(gc,target),gc.devilFruitType,'Devil Fruit')}
    ${bountyCell(br,gc.bounty)}
    ${cell(compareSea(gc,target),gc.sea,'Origin')}
    ${arcCell(compareArc(gc,target),gc.arc||'Unknown')}
    ${cell(compareHaki(gc,target),gc.haki||'None','Haki')}
    ${cell(compareStatus(gc,target),gc.status,'Status')}
  `;
  grid.insertBefore(row,grid.firstChild);

  const cnt=guesses.length;
  document.getElementById('guess-counter').textContent=cnt+(cnt===1?' guess':' guesses');

  if(gc.name===target.name)endGame(true,cnt);
}

function flash(){
  searchInput.style.borderColor='var(--red)';
  setTimeout(()=>searchInput.style.borderColor='',700);
}
function showErr(msg){
  searchInput.style.borderColor='var(--red)';
  searchInput.placeholder=msg;
  setTimeout(()=>{searchInput.style.borderColor='';searchInput.placeholder='Type a character name to guess...';},1600);
}

// ── GIVE UP ───────────────────────────────────────────
function giveUp(){
  if(gameOver)return;
  if(!guesses.length){showErr('Make at least one guess first!');return;}
  endGame(false,guesses.length);
}

// ── END GAME ──────────────────────────────────────────
function endGame(won,cnt){
  gameOver=true;
  document.getElementById('search-input').disabled=true;

  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const init=target.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const col=avatarColor(target);
  const dfText=target.devilFruitType==='None'?'No Devil Fruit':target.devilFruitType+' user';

  if(won){
    rs.className='win';
    rs.innerHTML=`
      <h2>🏆 Yohohoho!</h2>
      <p>You found the character in <strong>${cnt}</strong> ${cnt===1?'guess':'guesses'}!</p>
      <div class="character-card">
        <div class="character-card-avatar" style="background:linear-gradient(135deg,${col},${col}99)">${init}</div>
        <div class="character-card-info">
          <h3>${target.name}</h3>
          <p>${target.affiliation} · ${dfText} · ${fmtBounty(target.bounty)}</p>
          <p style="font-size:0.78rem;margin-top:3px;color:#64748b">First arc: ${target.arc||'Unknown'} · Haki: ${target.haki||'None'}</p>
        </div>
      </div>
      <button class="btn-new-game" onclick="initGame()">⚓ New Game</button>`;
  } else {
    rs.className='lose';
    rs.innerHTML=`
      <h2>☠️ Defeated!</h2>
      <p>The answer was:</p>
      <div class="character-card">
        <div class="character-card-avatar" style="background:linear-gradient(135deg,${col},${col}99)">${init}</div>
        <div class="character-card-info">
          <h3>${target.name}</h3>
          <p>${target.affiliation} · ${dfText} · ${fmtBounty(target.bounty)}</p>
          <p style="font-size:0.78rem;margin-top:3px;color:#64748b">First arc: ${target.arc||'Unknown'} · Haki: ${target.haki||'None'}</p>
        </div>
      </div>
      <button class="btn-new-game" onclick="initGame()">⚓ Try Again</button>`;
  }
}

  sg.style.display = 'block';

    var already = descWrong.indexOf(c.name) >= 0;

function switchMode(mode){

  allModes.forEach(function(m){
    var el=document.getElementById(m+'-mode');
    var btn=document.getElementById('btn-'+m);
    if(!el||!btn)return;
    if(m===mode){el.classList.add('active');btn.classList.add('active');}
    else{el.classList.remove('active');btn.classList.remove('active');}
  });
  var cl=document.getElementById('classic-mode');

  if(mode==='stats'&&!statsTarget)initStatsMode();
  if(mode==='silhouette'&&!silTarget)initSilMode();
  if(mode==='crew'&&!crewTarget)initCrewMode();

}

function buildModeSearch(inputId,srchFn,keyFn,pickFn,giveupFn,suggId){return '<div class="search-section" style="max-width:700px;margin:0 auto 1rem"><div class="search-wrapper" style="flex:1;position:relative"><input type="text" id="'+inputId+'" autocomplete="off" placeholder="Type a character name to guess..." style="width:100%;background:var(--card);border:2px solid rgba(240,192,64,0.4);color:var(--white);padding:12px 16px;border-radius:10px;font-size:1rem;font-family:Nunito,sans-serif;outline:none" oninput="'+srchFn+'(this.value)" onkeydown="'+keyFn+'(event)"><div id="'+suggId+'" style="position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid rgba(240,192,64,0.3);border-radius:10px;max-height:260px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)"></div></div><button class="btn-giveup" onclick="'+giveupFn+'()">Give Up</button></div>';}
window.buildModeSearch=buildModeSearch;
function buildGenericResult(won,target,modeIcon,modeName,wrongCount,reinitFn){var col=avatarColor(target);var init=target.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();var bg=won?'linear-gradient(135deg,rgba(22,101,52,0.3),rgba(21,128,61,0.2))':'linear-gradient(135deg,rgba(127,29,29,0.3),rgba(153,17,17,0.2))';var border=won?'var(--green)':'var(--red)';var title=won?('🏆 You got it! '+(wrongCount===0?'(First try!!)':'')):'☠️ It was...';var subtitle=won?('Guessed with <strong style="color:var(--gold)">'+wrongCount+'</strong> wrong guess'+(wrongCount===1?'':'es')+'!'):'';var btnLabel=won?(modeIcon+' Next Character'):(modeIcon+' Try Again');return '<div style="display:block;text-align:center;padding:2rem;margin-top:1rem;border-radius:16px;background:'+bg+';border:2px solid '+border+'"><h2 style="font-family:Cinzel,serif;font-size:1.8rem;margin-bottom:0.5rem;color:var(--gold)">'+title+'</h2>'+(subtitle?'<p style="color:#94a3b8;margin-bottom:1rem">'+subtitle+'</p>':'')+'<div style="display:inline-flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:14px 20px;margin:0.8rem auto"><div style="background:linear-gradient(135deg,'+col+','+col+'99);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;border:2px solid var(--gold);flex-shrink:0;color:white">'+init+'</div><div><h3 style="font-family:Cinzel,serif;color:var(--gold);font-size:1.1rem">'+target.name+'</h3><p style="color:#94a3b8;font-size:0.82rem;margin-top:2px">'+target.affiliation+'</p></div></div><br><button class="btn-new-game" onclick="'+reinitFn+'()" style="margin-top:1rem">'+btnLabel+'</button></div>';}
window.buildGenericResult=buildGenericResult;

initGame();

</script>
</body>
</html>
